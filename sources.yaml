# Every schedule the pipeline pulls. Add a source here; no code change needed
# if its `type` already has an adapter (gobound, wmt, ics, manual).
#
#   id        short unique key (used in filters + status)
#   name      display name (also the "School / Team" filter label)
#   type      adapter: gobound | wmt | ics | manual
#   category  High School | College | Pro / Minor
#   enabled   set false to skip without deleting

home:
  name: Deerfield, IL
  lat: 42.1711
  lon: -87.8445

window_days: 120   # how far ahead to keep events

sources:
  # ---- High schools (GoBound iCal: gobound.com/il/schools/<slug>/calendar/ical)
  - {id: deerfield,      name: Deerfield HS,       type: gobound, slug: deerfield,      category: High School}
  - {id: highlandpark,   name: Highland Park HS,   type: gobound, slug: highlandpark,   category: High School}
  - {id: lakeforest,     name: Lake Forest HS,     type: gobound, slug: lakeforest,     category: High School}
  - {id: stevenson,      name: Stevenson HS,       type: gobound, slug: stevenson,      category: High School}
  - {id: glenbrooknorth, name: Glenbrook North HS, type: gobound, slug: glenbrooknorth, category: High School}
  - {id: glenbrooksouth, name: Glenbrook South HS, type: gobound, slug: glenbrooksouth, category: High School}
  - {id: newtrier,       name: New Trier HS,       type: gobound, slug: newtrier,       category: High School}
  - {id: libertyville,   name: Libertyville HS,    type: gobound, slug: libertyville,   category: High School}

  # ---- Colleges
  - id: northwestern
    name: Northwestern
    type: wmt
    base_url: https://nusports.com
    category: College
    home_venue: {name: "Northwestern campus, Evanston", lat: 42.0565, lon: -87.6753}
    home_regex: "Evanston"   # only these "home" events get the campus coordinates

  # SIDEARM sites (/services/responsive-calendar.ashx). home_venue = default pin for home games;
  # facilities = exact pins for specific venues (facility title as the site spells it).
  - id: lakeforestcollege
    name: Lake Forest College
    type: sidearm
    base_url: https://goforesters.com
    category: College
    home_venue: {name: "Lake Forest College campus", lat: 42.2490, lon: -87.8288}

  - id: loyola
    name: Loyola Chicago
    type: sidearm
    base_url: https://loyolaramblers.com
    category: College
    home_venue: {name: "Loyola Lake Shore campus", lat: 41.9990, lon: -87.6580}

  - id: uic
    name: UIC
    type: sidearm
    base_url: https://uicflames.com
    category: College
    home_venue: {name: "UIC campus", lat: 41.8720, lon: -87.6560}

  - id: depaul
    name: DePaul
    type: sidearm
    base_url: https://depaulbluedemons.com
    category: College
    home_venue: {name: "DePaul Lincoln Park campus", lat: 41.9246, lon: -87.6553}
    facilities:
      Wintrust Arena: [41.8537, -87.6200]

  # ---- Pro / minor league
  - id: wolves
    name: Chicago Wolves
    type: hockeytech
    client_code: ahl
    key: 50c2cd9b5e18e390        # public key used by theahl.com's own stats pages
    team_id: 330
    category: Pro / Minor
    link: https://www.chicagowolves.com/schedule/
    venues: {Allstate Arena: [41.9875, -87.8889]}

  - id: stars
    name: Chicago Stars FC
    type: espn
    league: soccer/usa.nwsl
    team_id: 15360
    sport: Soccer
    gender: Girls/Women
    category: Pro / Minor
    link: https://chicagostarsfc.com/schedule
    venues:
      Martin Stadium: [42.0592, -87.6727]
      SeatGeek Stadium: [41.7646, -87.8063]
      Wrigley Field: [41.9484, -87.6553]

  # Seasonal teams still to add (no clean feed found 2026-10-05; seasons start May 2027,
  # beyond the 120-day window until ~Jan). Revisit when game times are posted:
  #   Chicago Dogs (American Association, Rosemont), Schaumburg Boomers + Windy City
  #   ThunderBolts (Frontier League; stats on pro.iscorecentral.com/FL), Chicago Fire II
  #   (MLS Next Pro; not on ESPN's API).

  # ---- One-off events typed in by hand (manual_events.yaml)
  - {id: manual, name: Other events, type: manual, file: manual_events.yaml, category: Other}

# Cost tiers: Free | $ (roughly under $15) | $$ (pricier / ticketed) | Unknown
# Feeds don't publish prices, so these are best-guess rules. First match wins.
# Match keys (all optional): category, source, sport (list ok), level, title_regex.
cost_rules:
  - {category: High School, title_regex: "(?i)\\bIHSA\\b|regional|sectional|super-?sectional|state final",
     tier: "$", note: "IHSA postseason: tickets usually required (~$5–8)"}
  - {category: High School, sport: [Football, Basketball], level: Varsity,
     tier: "$", note: "Varsity football/basketball often has a small gate fee (~$5); students & kids often free"}
  - {category: High School, tier: Free, note: "Regular-season high school events are usually free"}
  - {source: northwestern, sport: [Football, Basketball], tier: "$$", note: "Ticketed (nusports.com/tickets)"}
  - {source: northwestern, sport: [Lacrosse, Softball, Volleyball, Wrestling], tier: "$",
     note: "Usually ticketed but inexpensive; check nusports.com/tickets"}
  - {source: northwestern, tier: Free, note: "Most Northwestern Olympic-sport events are free"}
  - {source: lakeforestcollege, tier: Free, note: "Division III: games are free to attend"}
  - {source: [loyola, depaul], sport: Basketball, tier: "$$", note: "Ticketed Division I basketball"}
  - {source: uic, sport: Basketball, tier: "$", note: "Ticketed, usually inexpensive"}
  - {category: College, tickets: true, tier: "$", note: "Tickets sold for this event (see event page)"}
  - {category: College, tier: Free, note: "Most college Olympic-sport events are free"}
  - {source: wolves, tier: "$$", note: "Ticketed; cheapest seats are usually ~$15–25, with frequent family/kids deals"}
  - {source: stars, tier: "$$", note: "Ticketed; cheapest seats are usually ~$20–30"}
