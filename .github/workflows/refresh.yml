# Refreshes data/events.json from every source in sources.yaml, then commits it.
# GitHub Pages redeploys automatically on the commit.
# Manual run: GitHub repo > Actions > "Refresh schedules" > Run workflow.
name: Refresh schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"   # daily ~5:15am Chicago (10:15 UTC)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/fetch.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh schedules $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
